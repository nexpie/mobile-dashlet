<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>IoT Dashboard</title>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta
      name="viewport"
      content="width = device-width, initial-scale = 1, maximum-scale = 1, user-scalable = no"
    />

    <link href="dashlet.min.css" rel="stylesheet">
    
    <link href="theme.light.css" rel="stylesheet" />
    
    <style>
      /* the board is offset by JS (top: 20px) to make room for an admin bar this
         page does not have: put it as far from the top edge as from the side
         edges (body border 5px + pane margin 6px) */
      #board-content {
        top: 5px !important;
      }
    </style>

    <!-- remote console debug logging -->
    <!-- <script src="//console.re/connector.js" data-channel="1579-b771-8d8d"  id="consolerescript"></script> -->

    
    
  </head>
  <body style="margin: 0; padding: 0">
    <div id="board-content">
      <div class="gridster responsive-column-width">
        <ul data-bind="grid: true" id="board-background"></ul>
      </div>
    </div>
    <div class="edit-mode-label">Edit Mode</div>
    <header id="main-header" data-bind="if:false">
      <div id="datasources"></div>

      <div class="theme-toggle">
        <input
          type="checkbox"
          name="toggle"
          class="theme-toggle-checkbox"
          id="theme-toggle"
          onclick="toggleTheme()"
        />
      </div>
    </header>

    <div style="display: hidden">
      <ul data-bind="template: { name: 'pane-template', foreach: panes}"></ul>
    </div>

    <script type="text/html" id="pane-template">
      <li data-bind="pane: true">
        <!-- edit mode, widget sub-mode: enter pane sub-mode (top-left, same row as the first widget's tools) -->
        <div class="pane-enter" title="Edit pane">
          <i class="fa fa-chevron-right"></i>
        </div>
        <!-- Old style: Header with tools inside (when hide_blank_header_bar = false) -->
        <header data-bind="css: { 'pane-header--hidden': !isHeaderVisible() }">
          <h1 data-bind="text: title"></h1>
          <ul class="board-toolbar pane-tools">
            <li class="pane-exit" title="Back to editing widgets">
              <i class="fa fa-chevron-left icon-white icon-pane"></i>
            </li>
            <li data-bind="pluginEditor: {operation: 'add', type: 'widget'}">
              <i class="fa fa-plus icon-white icon-pane"></i>
            </li>
            <li data-bind="pluginEditor: {operation: 'clone', type: 'pane'}">
              <i class="fa fa-clone icon-white icon-pane"></i>
            </li>
            <li data-bind="pluginEditor: {operation: 'edit', type: 'pane'}">
              <i class="fa fa-wrench icon-white icon-pane"></i>
            </li>
            <li data-bind="pluginEditor: {operation: 'delete', type: 'pane'}">
              <i class="fa fa-trash icon-white icon-pane"></i>
            </li>
          </ul>
        </header>

        <!-- New style: Header separate from tools (when hide_blank_header_bar = true) -->
        <!-- <header data-bind="css: { 'pane-header--hidden': !isHeaderVisible() }">
          <h1 data-bind="text: title"></h1>
        </header> -->

        <!-- <div class="tools-container">
        <button data-bind="pluginEditor: {operation: 'add', type: 'widget'}">
          <i class="fa fa-plus icon-pane"></i>
        </button>
        <button data-bind="pluginEditor: {operation: 'clone', type: 'pane'}">
          <i class="fa fa-clone icon-pane"></i>
        </button>
        <button data-bind="pluginEditor: {operation: 'edit', type: 'pane'}">
          <i class="fa fa-wrench icon-pane"></i>
        </button>
        <button data-bind="pluginEditor: {operation: 'delete', type: 'pane'}">
          <i class="fa fa-trash icon-pane"></i>
        </button>
      </div> -->

        <!-- Widgets Section -->
        <section data-bind="foreach: widgets">
          <div
            class="sub-section"
            data-bind="css: 'sub-section-height-' + height()"
          >
            <div
              class="widget"
              data-bind="widget: true, css:{fillsize:fillSize}"
            ></div>

            <!-- Widget Tools - Old style (when hide_blank_header_bar = false) -->
            <!-- ko ifnot: $parent.useNewUI -->
            <div class="sub-section-tools">
              <ul class="board-toolbar">
                <!-- ko if:$parent.widgetCanMoveUp($data) -->
                <li data-bind="click:$parent.moveWidgetUp">
                  <i class="fa fa-chevron-up icon-white"></i>
                </li>
                <!-- /ko -->
                <!-- ko if:$parent.widgetCanMoveDown($data) -->
                <li data-bind="click:$parent.moveWidgetDown">
                  <i class="fa fa-chevron-down icon-white"></i>
                </li>
                <!-- /ko -->
                <li data-bind="click:$parent.cloneWidget">
                  <i class="fa fa-clone icon-white"></i>
                </li>
                <li
                  data-bind="pluginEditor: {operation: 'edit', type: 'widget'}"
                >
                  <i class="fa fa-wrench icon-white"></i>
                </li>
                <li
                  data-bind="pluginEditor: {operation: 'delete', type: 'widget'}"
                >
                  <i class="fa fa-trash icon-white"></i>
                </li>
              </ul>
            </div>
            <!-- /ko -->

            <!-- Widget Tools - New style (when hide_blank_header_bar = true) -->
            <!-- ko if: $parent.useNewUI -->
            <div class="sub-section-tools">
              <div class="widget-tools-buttons">
                <!-- ko if:$parent.widgetCanMoveUp($data) -->
                <button data-bind="click:$parent.moveWidgetUp">
                  <i class="fa fa-chevron-up"></i>
                </button>
                <!-- /ko -->

                <!-- ko if:$parent.widgetCanMoveDown($data) -->
                <button data-bind="click:$parent.moveWidgetDown">
                  <i class="fa fa-chevron-down"></i>
                </button>
                <!-- /ko -->

                <button data-bind="click:$parent.cloneWidget">
                  <i class="fa fa-clone"></i>
                </button>
                <button
                  data-bind="pluginEditor: {operation: 'edit', type: 'widget'}"
                >
                  <i class="fa fa-wrench"></i>
                </button>
                <button
                  data-bind="pluginEditor: {operation: 'delete', type: 'widget'}"
                >
                  <i class="fa fa-trash"></i>
                </button>
              </div>
            </div>
            <!-- /ko -->
          </div>
        </section>
      </li>
    </script>
  <script src="dashlet.min.js"></script><script>var head={js:function(){var f=arguments[arguments.length-1];if(typeof f==='function')f();}};</script><script type="text/javascript">
      head.js(
        "js/freeboard.thirdparty.min.js",
        "js/freeboard_plugins.min.js",
        "js/thirdparty_plugins.js",
        "js/nexpie_plugins.min.js",

        function () {
          $(function () {
            changeTheme('light');
            freeboard.setPostMessageCallback((msg) => {
              if (parentcallback && typeof parentcallback == "function") {
                parentcallback(msg);
              }
              if (typeof messageHandler != "undefined") {
                if (typeof messageHandler.postMessage == "function") {
                  messageHandler.postMessage(msg);
                }
              }
            });
            freeboard.initDashCredential(location.hash.substring(1));
            freeboard.loadFromGraphQL();
            freeboard.initialize(true);
          });
        }
      );

      function _saveDashboard(confirm) {
        freeboard.saveConfigToGraphQL(confirm);
      }

      function _addPane() {
        freeboard.createPane();
      }

      function _toggleEditing() {
        freeboard.toggleEditing();
      }

      function _setEditing(editing, animate) {
        freeboard.setEditing(editing, animate);
      }

      function _resetDashboard(confirm) {
        freeboard.resetDashboard(confirm, false);
      }

      let parentcallback = null;

      function _setPostMessageCallback(_parentcallback) {
        parentcallback = _parentcallback;
      }

      function _setDashCredential({ credential, forcereload }) {
        freeboard.setDashCredential({ credential, forcereload });
      }

      function _reloadDashboard(rev) {
        freeboard.reloadDashboard(rev);
      }

      function _isConfigSaved() {
        return freeboard.isConfigSaved();
      }

      function _initSetting(option) {
        freeboard.initSetting(option);
        option.headless = true;
        if (option.theme) {
          changeTheme(option.theme);
        }
      }

      function _getEditStatus(option) {
        return freeboard.getEditStatus(option);
      }

      function _exportConfig() {
        return freeboard.exportDashboard();
      }

      function _importConfig() {
        return freeboard.loadDashboardFromLocalFile();
      }

      function closeDialogBox() {
        return freeboard.closeDialogBox();
      }

      function widgetSettingCancel() {
        return freeboard.widgetSettingCancel();
      }

      function widgetSettingSave() {
        return freeboard.widgetSettingSave();
      }

      function jsEditorSave() {
        return freeboard.jsEditorSave();
      }
    </script></body>
</html>
